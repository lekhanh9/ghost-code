name: Build Android armv7

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android-armv7:
    name: Build Android armv7 (armeabi-v7a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Install Swift Android SDK (armv7)
        run: |
          echo "Installing Swift Android SDK for armv7..."
          swift sdk install https://github.com/finagolfin/swift-android-sdk/releases/download/6.0/swift-6.0-RELEASE-android-24-0.1.artifactbundle.tar.gz || true
          swift sdk list

      - name: Build for Android armv7
        run: |
          TARGET_SDK=$(swift sdk list 2>/dev/null | grep -i "armv7.*android" | head -n 1 | awk '{print $1}')
          if [ -n "$TARGET_SDK" ]; then
            echo "Building with Swift SDK: $TARGET_SDK"
            swift build --swift-sdk "$TARGET_SDK" -c release
          else
            echo "Building with target triple armv7-none-linux-androideabi24..."
            swift build -c release \
              -Xswiftc -target -Xswiftc armv7-none-linux-androideabi24 \
              -Xcc -target -Xcc armv7-none-linux-androideabi24
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-armv7-artifacts
          path: |
            .build/release/
            .build/armv7*/release/
          if-no-files-found: ignore
